services:
  # Online Backend Service (Express + Socket.IO)
  - type: web
    name: restaurant-pos-backend
    runtime: node
    rootDir: apps/backend
    # TEMP: switch back to "starter" before going live — free tier spins down after inactivity
    plan: free
    buildCommand: npm install && npm run build:postgres
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-pos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # Set to your deployed Vercel frontend URL (e.g. https://my-pos-app.vercel.app)

databases:
  # Managed Cloud PostgreSQL Database
  - name: restaurant-pos-db
    # TEMP: switch back to "starter" before going live — free database expires after 90 days
    plan: free
    databaseName: restaurant_pos
    user: pos_admin
