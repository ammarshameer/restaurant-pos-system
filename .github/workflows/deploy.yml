name: Deploy Restaurant POS to VPS

# Deploy only after the PostgreSQL test workflow has passed on the same commit.
# Keep "Test (PostgreSQL)" required in branch protection for main.
on:
  workflow_run:
    workflows: ["Test (PostgreSQL)"]
    types: [completed]
    branches: [main]

concurrency:
  group: restaurant-pos-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy on Contabo VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT || 22 }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ vars.APP_DIR || '/var/www/restaurant-pos' }}"
            DEPLOY_ENV_FILE="${{ vars.DEPLOY_ENV_FILE }}"
            if [[ -n "$DEPLOY_ENV_FILE" && -f "$DEPLOY_ENV_FILE" ]]; then
              # shellcheck disable=SC1090
              source "$DEPLOY_ENV_FILE"
            fi

            NODE_BIN_DIR="${NODE_BIN_DIR:-${{ vars.NODE_BIN_DIR }}}"
            PM2_BIN="${PM2_BIN:-${{ vars.PM2_BIN }}}"
            HEALTH_PORT="${HEALTH_PORT:-${{ vars.HEALTH_PORT || '3000' }}}"

            if [[ -z "$NODE_BIN_DIR" || -z "$PM2_BIN" ]]; then
              echo "Set repository variables NODE_BIN_DIR and PM2_BIN (or a DEPLOY_ENV_FILE)." >&2
              exit 1
            fi
            export PATH="${NODE_BIN_DIR}:$(dirname "$PM2_BIN"):${PATH}"

            # Backup/restore/baseline scripts need native PG 16 client tools
            # (piped restore and -f SQL files do not work through docker exec).
            sudo rm -f /usr/local/bin/pg_dump /usr/local/bin/psql
            if ! command -v pg_dump >/dev/null 2>&1 || ! command -v psql >/dev/null 2>&1; then
              echo "[deploy] Installing PostgreSQL 16 client tools"
              sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
              sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
              echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
                | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
              sudo apt-get update -qq
              sudo apt-get install -y -qq postgresql-client-16
            fi

            # The backup directory is created by root during initial setup.
            sudo mkdir -p /var/backups/restaurant-pos
            sudo chown "$(id -un):$(id -gn)" /var/backups/restaurant-pos

            cd "$APP_DIR"

            echo "==> Fetching tested commit ${{ github.event.workflow_run.head_sha }}"
            git fetch --prune origin main
            git reset --hard "${{ github.event.workflow_run.head_sha }}"

            echo "==> Backend: install, generate client, build"
            cd "$APP_DIR/apps/backend"
            npm ci
            npm run build

            echo "==> Database: backup before migrations (abort on failure)"
            npm run db:backup

            echo "==> Database: require a complete migration baseline"
            npm run db:migrate:check

            echo "==> Database: apply checked-in PostgreSQL migrations"
            npm run db:migrate

            echo "==> Frontend: install and build (VITE_API_URL from apps/frontend/.env)"
            cd "$APP_DIR/apps/frontend"
            npm ci
            npm run build

            echo "==> Web server: install POS Caddy site config"
            bash "$APP_DIR/deploy/configure-caddy.sh"

            echo "==> Restarting PM2 process"
            if "$PM2_BIN" describe restaurant-pos >/dev/null 2>&1; then
              "$PM2_BIN" restart restaurant-pos --update-env
            else
              cd "$APP_DIR/apps/backend"
              "$PM2_BIN" start dist/index.js --name restaurant-pos \
                --interpreter "${NODE_BIN_DIR}/node"
            fi
            "$PM2_BIN" save

            echo "==> Health check on port $HEALTH_PORT"
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${HEALTH_PORT}/health"; then
                echo
                echo "Deployment complete."
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed. Recent logs:" >&2
            "$PM2_BIN" logs restaurant-pos --nostream --lines 60 || true
            exit 1
