name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only server diagnostics
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            echo "== docker pg client =="
            docker exec restaurant-pos-db pg_dump --version 2>&1 || true
            echo "== connection test via docker exec (read-only) =="
            cd /var/www/restaurant-pos/apps/backend
            set -a
            source .env
            set +a
            DUMP_URL="${DATABASE_URL%%\?*}"
            docker exec restaurant-pos-db psql "$DUMP_URL" -tAc 'select 1' 2>&1 | head -5 || true
            echo "== dump smoke test (schema only, first lines) =="
            docker exec restaurant-pos-db pg_dump "$DUMP_URL" --schema-only --no-password 2>/dev/null | head -6 || true
            echo "== migration baseline markers =="
            docker exec restaurant-pos-db psql "$DUMP_URL" -tAc "select to_regclass('public._prisma_migrations')" 2>&1 | head -3 || true
