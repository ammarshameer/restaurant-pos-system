name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only server diagnostics
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            echo "== sudo / docker =="
            sudo -n true 2>&1 && echo "sudo: passwordless OK" || echo "sudo: NOT available"
            command -v docker || true
            docker ps --format '{{.Names}}\t{{.Image}}\t{{.Ports}}' 2>&1 | head -30 || true
            echo "== node paths =="
            ls -l /home/mujeeb/.nvm/versions/node/v20.20.2/bin/node 2>&1 || true
            ls -l /home/mujeeb/.nvm/versions/node/v24.15.0/bin/pm2 2>&1 || true
            echo "== health =="
            curl -fsS http://127.0.0.1:3146/health 2>&1 | head -5 || true
            echo
            echo "== migration status (read-only) =="
            cd /var/www/restaurant-pos/apps/backend
            PG_BIN_DIR="" npx prisma migrate status 2>&1 | head -40 || true
            echo "== git state =="
            git -C /var/www/restaurant-pos status -sb | head -5 || true
