name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only server diagnostics
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            echo "== whoami / shell =="
            whoami
            echo "SHELL=$SHELL"
            echo "PATH=$PATH"
            echo "== node / pm2 =="
            command -v node || true
            node --version 2>&1 || true
            command -v pm2 || true
            command -v pg_dump || true
            command -v psql || true
            echo "== postgres candidates =="
            ls -ld /usr/lib/postgresql /usr/lib/postgresql/* /usr/lib/postgresql/*/bin 2>&1 || true
            ls -l /usr/lib/postgresql/*/bin/pg_dump 2>&1 || true
            find /usr /opt -maxdepth 6 -type f -name pg_dump 2>/dev/null | head -20 || true
            echo "== app dir =="
            ls -ld /var/www/restaurant-pos 2>&1 || true
            echo "== backend env (keys only) =="
            sed -E 's/=.*/=<redacted>/' /var/www/restaurant-pos/apps/backend/.env 2>&1 || true
            echo "== pm2 list =="
            /home/mujeeb/.nvm/versions/node/v24.15.0/bin/pm2 list 2>&1 || true
            echo "== listening ports =="
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | head -30 || true
