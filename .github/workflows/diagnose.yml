name: Diagnose VPS (read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only server diagnostics
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            echo "== backend env key/value lengths (no values) =="
            awk -F= '/^[A-Za-z_]/ { print $1, length($0)-length($1)-1 }' /var/www/restaurant-pos/apps/backend/.env 2>&1 || true
            echo "== frontend env =="
            cat /var/www/restaurant-pos/apps/frontend/.env 2>&1 || true
            echo "== backup config =="
            ls -ld /var/backups/restaurant-pos 2>&1 || true
            echo "== disk =="
            df -h /var/backups /var/www 2>&1 | head -10 || true
