name: Release Print Agent

on:
  push:
    tags: ['agent-v*']
    branches: [main]
    paths: ['apps/print-agent/**', '.github/workflows/print-agent-release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binaries for all platforms
        run: |
          cd apps/print-agent
          mkdir -p dist
          targets="windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for target in $targets; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/local-print-agent-${os}-${arch}"
            if [ "$os" = "windows" ]; then out="${out}.exe"; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags="-s -w" -o "$out" .
            echo "built $out"
          done
          ls -la dist

      - name: Publish binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'agent-latest' }}
          name: ${{ github.ref_type == 'tag' && format('Local Print Agent {0}', github.ref_name) || 'Local Print Agent (latest)' }}
          files: apps/print-agent/dist/*
