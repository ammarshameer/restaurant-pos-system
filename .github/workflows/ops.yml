name: VPS ops (controlled)

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        required: true
        type: choice
        options:
          - add-jwt-platform-secret
          - add-platform-admin-env
          - rehearse-baseline
          - baseline-live
          - install-pg-client
          - inspect-db
          - inspect-baseline
          - recover-baseline
          - verify

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Run selected task over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            TASK="${{ inputs.task }}"
            APP_DIR="/var/www/restaurant-pos"
            BACKEND="$APP_DIR/apps/backend"
            DB_CONTAINER="restaurant-pos-db"
            SCRATCH_DB="restaurant_pos_rehearsal"

            set -a
            # shellcheck disable=SC1090
            source "$BACKEND/.env"
            set +a

            # Native PG 16 client tools are required for piped restore and -f
            # baseline scripts. Remove any earlier docker exec wrappers first.
            ensure_pg_client() {
              sudo rm -f /usr/local/bin/pg_dump /usr/local/bin/psql
              if command -v pg_dump >/dev/null 2>&1 && command -v psql >/dev/null 2>&1; then
                return
              fi
              echo "[ops] Installing PostgreSQL 16 client tools"
              sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
              sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
              echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
                | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
              sudo apt-get update -qq
              sudo apt-get install -y -qq postgresql-client-16
              pg_dump --version
              psql --version
            }
            ensure_pg_client
            sudo mkdir -p /var/backups/restaurant-pos
            sudo chown "$(id -un):$(id -gn)" /var/backups/restaurant-pos

            setup_scratch() {
              BASE_URL="$(cd "$BACKEND" && set -a && source .env && set +a && printf '%s' "${DATABASE_URL%%\?*}")"
              SCRATCH_URL="${BASE_URL%/*}/$SCRATCH_DB?schema=public"
              echo "[ops] DATABASE_URL=$SCRATCH_URL"
              psql "$BASE_URL" -c "DROP DATABASE IF EXISTS $SCRATCH_DB;" >/dev/null
              psql "$BASE_URL" -c "CREATE DATABASE $SCRATCH_DB;" >/dev/null
              printf '%s\n' "$SCRATCH_URL"
            }

            case "$TASK" in
              install-pg-client)
                echo "[ops] PostgreSQL client tools are installed"
                ;;

              add-jwt-platform-secret)
                cd "$BACKEND"
                if grep -q '^JWT_PLATFORM_SECRET=' .env; then
                  echo "[ops] JWT_PLATFORM_SECRET already present; no change."
                else
                  SECRET="$(openssl rand -hex 48)"
                  printf '\nJWT_PLATFORM_SECRET=%s\n' "$SECRET" >> .env
                  chmod 600 .env
                  echo "[ops] Added JWT_PLATFORM_SECRET (96 hex chars)."
                fi
                ;;

              add-platform-admin-env)
                cd "$BACKEND"
                sed -i 's|^SUPER_ADMIN_NAME=.*|SUPER_ADMIN_NAME="Super Administrator"|' .env
                if grep -q '^SUPER_ADMIN_EMAIL=' .env && grep -q '^SUPER_ADMIN_PASSWORD=' .env \
                   && grep -q '^SUPPORT_EMAIL=' .env && grep -q '^SUPPORT_PASSWORD=' .env; then
                  echo "[ops] Platform admin env vars already present; no change."
                else
                  SA_PASS="$(openssl rand -hex 24)"
                  SU_PASS="$(openssl rand -hex 24)"
                  {
                    printf '\nSUPER_ADMIN_NAME=Super Administrator\n'
                    printf 'SUPER_ADMIN_EMAIL=superadmin@restaurantpos.com\n'
                    printf 'SUPER_ADMIN_PASSWORD=%s\n' "$SA_PASS"
                    printf 'SUPPORT_EMAIL=support@restaurantpos.com\n'
                    printf 'SUPPORT_PASSWORD=%s\n' "$SU_PASS"
                  } >> .env
                  chmod 600 .env
                  echo "[ops] Added platform admin env vars; passwords stored in .env (not printed)."
                fi
                ;;

              rehearse-baseline)
                cd "$BACKEND"
                echo "==> Fresh backup of live (read-only on live DB)"
                npm run db:backup
                BACKUP="$(ls -1t /var/backups/restaurant-pos/restaurant-pos-*.sql.gz | head -1)"
                echo "[ops] Using backup: $BACKUP"

                echo "==> Rehearsal on scratch database"
                SCRATCH_URL="$(setup_scratch | tail -1)"
                ENV_FILE="$BACKEND/.env" RESTORE_DATABASE_URL="$SCRATCH_URL" \
                  npm run db:restore -- "$BACKUP"

                SCRATCH_ENV="/tmp/restaurant-pos-rehearsal.env"
                cp "$BACKEND/.env" "$SCRATCH_ENV"
                sed -i "s|^DATABASE_URL=.*|DATABASE_URL=$SCRATCH_URL|" "$SCRATCH_ENV"
                export ENV_FILE="$SCRATCH_ENV"
                export LIVE_BASELINE_CONFIRMED=yes
                echo "==> Baseline + backfill on scratch"
                npm run db:migrate:baseline
                npm run db:migrate:check
                echo "==> Backfill report on scratch"
                ENV_FILE="$SCRATCH_ENV" DATABASE_URL="$SCRATCH_URL" npm run db:backfill:all
                echo "==> Rehearsal PASSED (scratch database left for inspection)"
                ;;

              baseline-live)
                cd "$BACKEND"
                echo "==> Final backup of live before baseline"
                npm run db:backup
                echo "==> One-time live baseline + mandatory backfill"
                LIVE_BASELINE_CONFIRMED=yes npm run db:migrate:baseline
                echo "==> Verify live baseline gate"
                npm run db:migrate:check
                echo "==> Re-run idempotent backfill on live"
                npm run db:backfill:all
                echo "==> LIVE BASELINE COMPLETE"
                ;;

              inspect-db)
                echo "==> Container PG identity (no passwords)"
                docker exec "$DB_CONTAINER" sh -c \
                  'echo POSTGRES_USER=$POSTGRES_USER POSTGRES_DB=$POSTGRES_DB; psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "select current_user, rolcreatedb from pg_roles where rolname=current_user"'
                echo "==> Databases"
                docker exec "$DB_CONTAINER" sh -c \
                  'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "select datname from pg_database order by 1"'
                ;;

              inspect-baseline)
                cd "$BACKEND"
                echo "==> Migration history table"
                psql "${DATABASE_URL%%\?*}" -Atqc \
                  "select to_regclass('public._prisma_migrations') is not null"
                echo "==> Migration status"
                npm run db:migrate:status
                echo "==> Schema drift check"
                set +e
                npx prisma migrate diff --from-url "$DATABASE_URL" \
                  --to-schema-datamodel prisma/schema.prisma --exit-code
                echo "diff exit: $?"
                set -e
                ;;

              recover-baseline)
                cd "$BACKEND"
                echo "==> Marking checked-in migrations as applied"
                for migration in prisma/migrations/*_*/migration.sql; do
                  name="$(basename "$(dirname "$migration")")"
                  npx prisma migrate resolve --applied "$name"
                done
                echo "==> Idempotent backfill + fail-closed verification"
                npm run db:backfill:all
                echo "==> Verify baseline gate"
                npm run db:migrate:check
                echo "==> RECOVERY COMPLETE"
                ;;

              verify)
                echo "==> Health"
                curl -fsS http://127.0.0.1:3146/health; echo
                echo "==> Migration status"
                cd "$BACKEND"
                npm run db:migrate:status
                echo "==> Tenant website config"
                psql "${DATABASE_URL%%\?*}" -Atqc \
                  'select slug, "websiteSlug", "isActive", "onlineOrderingEnabled" from "Restaurant" order by name limit 5'
                echo "==> Frontend build time"
                ls -l --time-style=long-iso "$APP_DIR/apps/frontend/dist/index.html" 2>&1 || true
                echo "==> Git state"
                git -C "$APP_DIR" status -sb | head -3
                ;;

              *)
                echo "Unknown task: $TASK" >&2
                exit 1
                ;;
            esac
