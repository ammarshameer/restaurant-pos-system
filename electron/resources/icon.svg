  <path d="M176 270 C176 195 336 195 336 270 Z" fill="url(#goldGrad)"/>
  <rect x="156" y="270" width="200" height="14" rx="7" fill="url(#goldGrad)"/>
  <circle cx="256" cy="190" r="14" fill="url(#goldGrad)"/>
  
  <!-- POS Receipt Slot Base -->
  <rect x="190" y="300" width="132" height="60" rx="10" fill="url(#accentGrad)"/>
  <rect x="210" y="315" width="92" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="220" y="335" width="72" height="6" rx="3" fill="#93c5fd" opacity="0.8"/>
  <circle cx="256" cy="385" r="5" fill="#60a5fa"/>
