  </defs>
  
  <!-- App Background Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="12" opacity="0.4"/>
  <circle cx="256" cy="256" r="150" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  
  <!-- Fork and Knife & Cloche POS Graphic -->
